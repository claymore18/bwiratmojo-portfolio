# ╔══════════════════════════════════════════════════════════════════════╗
# ║              GitVitae — Portfolio Configuration                      ║
# ║  This is the only file you need to edit.                             ║
# ║  Run  pnpm check-config  to catch mistakes before deploying.         ║
# ╚══════════════════════════════════════════════════════════════════════╝

# ╔══════════════════════════════════════════════════════════════════════╗
# ║  ** FIRST THING TO CHANGE **                                         ║
# ║                                                                      ║
# ║  siteMode: "landing"  → shows the GitVitae intro page (default)      ║
# ║  siteMode: "portfolio" → shows YOUR portfolio                        ║
# ║                                                                      ║
# ║  Change it to "portfolio" once you have filled in your details.      ║
# ╚══════════════════════════════════════════════════════════════════════╝
siteMode: "portfolio"   # ← CHANGE THIS to "portfolio"
siteUrl:  "https://claymore18.github.io/bwiratmojo-portfolio/"  # ← Your GitHub Pages URL (used for RSS & canonical links)
showPoweredBy: false  # Set to true to show a small "Made with GitVitae" badge in your footer (helps others discover GitVitae)

# ── Identity ───────────────────────────────────────────── (required) ──
name: "B.Wiratmojo"              # Your name — shown in the header and used as a fallback in the avatar
title: "Lead Programmer - MES & Database"
tagline: "ICT Department | PT Bridgestone Tire Indonesia"
email: "b.wiratmojo@outlook.com"
phone: "+62 8960 2800 396"                    # Optional — e.g. "+1 (555) 000-1234". Shown in contact section and resume.
location: "Bekasi, West Java, Indonesia"
avatarUrl: ""  # Demo avatar — replace with your own photo URL (see instructions below)
# How to add a profile photo (free, no extra account needed):
#   1. Go to your GitHub repo → click "Add file" → "Upload files"
#   2. Upload your photo (e.g. avatar.jpg) into a folder called "public/"
#   3. After committing, open the file on GitHub and copy the raw URL:
#      https://raw.githubusercontent.com/YOU/your-repo/main/public/avatar.jpg
#   4. Paste that URL here.
# Leave empty to show your initials as a styled placeholder.

# ── Resume download ────────────────────────────────────────────────────
# Optional: link directly to a hosted PDF (Google Drive, Dropbox, etc.)
# If left blank the navbar "Resume" button opens the built-in resume page
# where visitors can use "Save PDF" to print their own copy.
#
# How to get a direct download link:
#   1. Visit /resume in your portfolio, click "Save PDF" -> save the file
#   2. Upload that PDF to Google Drive / Dropbox and copy the direct link
#   3. Paste the link below and update resumeFileName accordingly
#
# resumeUrl: "https://drive.google.com/uc?export=download&id=YOUR_FILE_ID"
# resumeFileName: "Git_Vitae_Resume.pdf"

# ── Status ─────────────────────────────────────────────────────────────
openToWork: true         # Shows "Open to Opportunities" banner when true

# ── Theme ──────────────────────────────────────────────────────────────
defaultTheme: "system"   # Options: light | dark | system
colorPreset: "custom"
primaryColor: "#2563EB" # Warna Emas
#colorPreset: "indigo"    # Options: indigo | emerald | rose | amber | ocean | slate | custom
# primaryColor: "#6366f1" # Optional — pick any colour you like and paste its hex code here.
                           # Overrides colorPreset above. To find a hex code:
                           #   → Google "colour picker", pick a colour, copy the 6-digit code (e.g. #e11d48)
                           #   → or grab one from coolors.co / your favourite site's colour

resumeTheme:
  twoColumn: "indigo"    # Accent color for the two-column resume layout
  classic: "emerald"     # Accent color for the classic resume layout

contactFormEndpoint: ""  # Optional — paste a Formspree URL (https://formspree.io/f/xxxx)
                           # or any POST endpoint that accepts {name, email, message}.
                           # Leave empty to use a pre-filled mailto: link instead.

# ── Section visibility ─────────────────────────────────────────────────
# Set show: false to hide any section from your portfolio
sections:
  - { id: about,          show: true  }
  - { id: stats,          show: false }  # Stats already appear as cards in the About section above — enable this only if you want a dedicated full-width stats section
  - { id: skills,         show: true  }
  - { id: languages,      show: true  }
  - { id: experience,     show: true  }
  - { id: projects,       show: true  }
  - { id: education,      show: true  }
  - { id: certifications, show: true  }
  - { id: publications,   show: false }
  - { id: testimonials,   show: true  }
  - { id: contact,        show: true  }

# ── Social links ───────────────────────────── (leave blank to hide) ───
social:
  github:   "https://github.com/claymore18"
  linkedin: "http://www.linkedin.com/in/b-wiratmojo"
  twitter:  ""
  website:  ""

# ── About ──────────────────────────────────────────────────────────────
# Use | for multi-line text. Indent each line by 2 spaces.
about: |
  I'm a portfolio-resume engineer with 5+ years of experience building products
  that people love. I specialize in React, Node.js, and distributed systems.
  When I'm not coding, I'm hiking trails or experimenting with new coffee
  brewing methods.


# ── Stats ──────────────────────────────────────────────────────────────
# Customise each label and value freely — change "Projects Shipped" to
# "Active Customers", "Happy Clients", "Open Source Stars", etc.
# Optional fields: prefix (e.g. "$") and suffix (e.g. "+" or "k").
# Remove all entries or set show: false above to hide this section.
stats:
  - { label: "System Projects", value: 30, suffix: "+" }
  - { label: "Business Functions", value: 8, suffix: "" }
  - { label: "IDR Saved (2024-25)", value: 9.6, prefix: "", suffix: "B+" }
  - { label: "Projects Led in 2025", value: 33, suffix: "" }
  - { label: "Sites Served", value: 3, suffix: "" }

# Examples of other combinations you can use:
#   - { label: "Active Users",    value: 10000, suffix: "+" }
#   - { label: "Revenue",         value: 2,     prefix: "$", suffix: "M+" }
#   - { label: "Countries",       value: 12,    suffix: ""  }

# ── Languages ──────────────────────────────────────────────────────────
# level options: Native | Fluent | Conversational | Basic
languages:
  - { name: "English",  level: "Native"        }
  - { name: "Spanish",  level: "Conversational" }
  - { name: "Mandarin", level: "Basic"          }

# ── Skills ─────────────────────────────────────────────────────────────
skills:
  - category: "APP"
    items: [System & application development]
  - category: "NETWORK"
    items: [Network design, Wi-Fi, OT links]
  - category: "SERVER / DC"
    items: [Servers, DMZ, data center]
  - category: "SECURITY"
    items: [Firewall, VPN, API & pentest]
  - category: "GOVERNANCE"
    items: [PMO, charters, approvals]

# ── Experience ─────────────────────────────────────────────────────────

# ── Projects ───────────────────────────────────────────────────────────
# Set featured: true to show in the Featured section (max 3 recommended)
projects:
  - name: "Digital Waste-Scrap Monitoring System"
    description: |
      "No project brief. No budget approved. Just one question and $250K saved."      
      Situation: Top management flagged that waste-scrap data was a mess, with an estimated potential loss of $250,000 – $300,000 per year.
      Task & Role: Stepped up as Lead to bridge the shop floor and boardroom.
      Action: Presented findings and proposed an in-house digital waste-scrap monitoring system. Built it from scratch in June 2025.
      Result: Ahead of Schedule. Delivered in November 2025. Pushed the cost impact close to zero, saving an estimated ~$250K+ in just 6 months.
    tags: [APP, DATA, GOVERNANCE]
    featured: true
    
# ── Education ──────────────────────────────────────────────────────────
education:
  - institution: "Bina Insani University"
    degree: "B.S. Informatics Engineering"
    period: "2019-2020"
  - institution: "STMIK Akademi Bina Insani"
    degree: "Diploma Management Informatics"
    period: "2005-2008"

# ── Certifications ─────────────────────────────────────────────────────

# ── Publications ───────────────────────────────────────────────────────
# Optional — ideal for researchers, academics, and technical writers.
# type options: conference | journal | preprint | book-chapter | workshop

# ── Testimonials ───────────────────────────────────────────────────────

# ── Analytics (optional, always free) ──────────────────────────────────────
# Two ways to track who visits your portfolio — both free, no credit card:
#
# 1. GitHub built-in traffic (zero setup — already there!)
#    Go to your repository → Insights → Traffic.
#    Shows unique visitors, page views, and top referrers for the last 14 days.
#
# 2. GoatCounter (more detail, privacy-friendly, free forever for personal use)
#    Sign up at https://www.goatcounter.com — you'll get a short code, e.g. "janedoe"
#    Uncomment the two lines below and replace "yourcode" with your GoatCounter code:
#
# analytics:
#   goatcounterCode: "yourcode"

# ── Blog ─────────────────────────────────────────────────────────────────────
# Drop any .md file into the blog/ folder — it becomes a post automatically.
# Each post starts with a small block called "frontmatter" (between --- lines):
#
#   ---
#   title: "My Post Title"
#   date: "2025-01-15"
#   tags: [life, tech]
#   excerpt: "One sentence that appears on the listing page."
#   ---
#
# Then write your post in plain Markdown below the closing ---.
# See the sample posts in blog/ to get started.
blog:
  enabled: true
  title: "Blog"
  description: "Thoughts, stories and ideas — everything in one place."
