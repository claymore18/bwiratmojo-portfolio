# ── Projects ───────────────────────────────────────────────────────────
projects:
  - name: "Digital Waste-Scrap Monitoring System"
    description: |
      "No project brief. No budget approved. Just one question and $250K saved."
      Situation: Top management flagged that waste-scrap data was a mess, with an estimated potential loss of $250,000 – $300,000 per year.
      Task & Role: Stepped up as Lead to bridge the shop floor and boardroom. Authorized to investigate, I spent 3-4 days directly on the production floor.
      Action: Proposed an in-house digital waste-scrap monitoring system with a real-time dashboard. Built it from scratch in June 2025.
      Result: Ahead of Schedule. Delivered in November 2025. Pushed the cost impact close to zero, saving an estimated ~$250K+ in just 6 months.
    tags: [APP, DATA, GOVERNANCE]
    featured: true

  - name: "Rolling Forecast"
    description: |
      Situation: Sales & supply planning required accurate demand prediction to avoid overstocking.
      Task & Role: System designer and developer for predictive forecasting.
      Action: Built rolling forecast with exponential smoothing/moving average formulas, 12-month lookahead, and Power BI dashboards.
      Result: Presented globally at APIC-SCM Vietnam; saved IDR 5.1 billion (Yr 1) and IDR 200 million (Yr 2).
    tags: [APP, GOVERNANCE]
    featured: true

  - name: "Tire Warehouse WMS and SAP Integration"
    description: |
      Situation: Cloud WMS from AurionPro needed to exchange data with SAP across regional networks.
      Task & Role: ICT Lead to make the whole chain work end-to-end.
      Action: Designed integration path, set up SFTP in DMZ, arranged VPN, worked with BSIN network teams, mapped Wi-Fi access points, and built custom middleware.
      Result: WMS went live with stable SAP link, secure ongoing firewall traffic management.
    tags: [APP, NETWORK, SERVER/DC, SECURITY]
    featured: true

  - name: "Canteen Management System"
    description: |
      Situation: Transitioning the canteen application from project development into operational runtime for all plant (BKS-KRW-HO).
      Task & Role: Developer and handover lead to institutionalize business ownership.
      Action: Registered and provisioned all plant users, established clear operational guidelines, and formally transitioned daily oversight to the HRGA department.
      Result: Successfully institutionalized sustainable, business-led operations. Ensured zero downtime post-handover.
    tags: [APP, GOVERNANCE]
    featured: false

  - name: "Contract Management System"
    description: |
      Situation: The Legal team was still tracking contract and license expiry dates by hand.
      Task & Role: Sole developer, taking it from analysis to rollout.
      Action: Built a weighted phase project plan, use cases, database model, and email reminder modules.
      Result: Achieved 85% completion on schedule. The governance framework built here became the company-wide gold standard.
